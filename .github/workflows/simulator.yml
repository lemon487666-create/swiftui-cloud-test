name: Build iPhone simulator app
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report Xcode and simulator SDK
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build SwiftUI app and verify simulator binary
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/simulator-build"
          xcodebuild -project CloudHello.xcodeproj -target CloudHello -configuration Debug -sdk iphonesimulator CONFIGURATION_BUILD_DIR="$output" CODE_SIGNING_ALLOWED=NO build
          test -x "$output/CloudHello.app/CloudHello"
          test "$(plutil -extract DTPlatformName raw "$output/CloudHello.app/Info.plist")" = iphonesimulator
          echo "Verified CloudHello.app for the iOS Simulator." >> "$GITHUB_STEP_SUMMARY"
